networks:
  app-network:
    driver: bridge

services:
  # Dịch vụ 1: SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: qldsv-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    networks:
      - app-network
    volumes:
      # Mount script tạo DB vào container
      - ./Gendb.sql:/docker-entrypoint-initdb.d/Gendb.sql
    healthcheck:
      # Thêm -S localhost để đảm bảo kết nối nội bộ
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-C", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Cho phép SQL Server 40 giây khởi động trước khi bắt đầu đếm lỗi
      start_period: 40s
    restart: always

  redis:
    image: redis:alpine
    container_name: qldsv-redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: always

  # Dịch vụ 2: Ứng dụng Web Java
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qldsv-web
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - AVATAR_UPLOAD_PATH=/usr/local/tomcat/external/avatars
    volumes:
      - ./src/main/resources/momo.properties:/usr/local/tomcat/lib/momo.properties
      - ./src/main/resources/pusher.properties:/usr/local/tomcat/lib/pusher.properties
      - ./src/main/resources/redis.properties:/usr/local/tomcat/lib/redis.properties
      - ./src/main/resources/database.properties:/usr/local/tomcat/lib/database.properties
      - ./src/main/resources/gmail.properties:/usr/local/tomcat/lib/gmail.properties
      # - ./src/main/resources/chatbot.properties:/usr/local/tomcat/lib/chatbot.properties
      - ./uploads/avatars:/usr/local/tomcat/external/avatars
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  # Dịch vụ 3: Cloudflare Tunnel (Bảo mật Zero Trust)
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: qldsv-cloudflare-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - app-network
    depends_on:
      - web
    restart: always
